# The same gate as before every commit (CLAUDE.md "Commands"): formatting, clippy with
# warnings as errors, and the whole test suite, on Linux and Windows. No test needs a GPU or
# the network: `sim` and `tables` are pure, the shaders are checked by naga, and the feed's
# tests use saved JSON.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      # The toolchain (version, rustfmt, clippy) comes from rust-toolchain.toml.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # eframe's X11 and Wayland back ends load their system libraries at run time, but some
      # of their crates still look for the headers when they build. The app's sound (rodio's
      # cpal) links ALSA.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libasound2-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
